<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · {{ cfg.dashboard.app_name }}</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F2F2F7; color: #000; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } p { color: rgba(235,235,245,.6) !important; } }
  img { width: 76px; height: 76px; border-radius: 17px; }
  h1 { font-size: 22px; margin: 18px 0 6px; } p { color: rgba(60,60,67,.6); margin: 0 0 20px; line-height: 1.4; }
  button { font: 600 17px -apple-system, sans-serif; color: #fff; background: #007AFF; border: 0; border-radius: 12px; padding: 12px 22px; }
</style></head>
<body><div>
  <img src="/static/icons/apple-touch-icon.png" alt="">
  <h1>Can't reach your Second Brain</h1>
  <p>You're offline or not on the tailnet.<br>Pages you've opened before still work.</p>
  <button onclick="location.reload()">Try again</button>
</div></body></html>
