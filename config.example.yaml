# Copy to config.yaml (gitignored) and fill in. Most settings can also be changed later on the
# dashboard's Settings page; those edits are stored in the brain's database and override this file.
# Secrets can instead come from env vars:
#   HA_AGENT_TOKEN, HA_DISCORD_WEBHOOK_URL, HA_MAIL_PASSWORD, HA_DASHBOARD_PASSWORD
timezone: America/Chicago

llm:
  base_url: http://spark:8000/v1          # Spark's Tailscale MagicDNS name
  model: Qwen/Qwen3-32B                   # the served model name (GET /v1/models)
  api_key: null                           # only if your vLLM was started with --api-key
  temperature: 0
  disable_thinking: true                  # sends chat_template_kwargs.enable_thinking=false
  timeout_s: 30
  max_tokens: 1024

watch:
  imessage:
    allow:
      - handle: "+1785555XXXX"            # phone (E.164) or Apple ID email
        label: Wife
        enabled: true
      # - handle: "+1785555YYYY"          # your own number = notes-to-self capture inbox
      #   label: Me
      #   is_me: true
      # - chat_id: "iMessage;+;chat123456"  # a whole group chat
      #   label: Family group
    allow_self_notes: false               # process messages *I* send in allowed chats
  mail:
    enabled: false
    host: imap.example.com
    port: 993
    username: me@example.com
    password: null                        # or HA_MAIL_PASSWORD
    folders: [INBOX]
    allow_senders: ["*@school.example.org"]
    labels:                               # optional: sender pattern -> label shown in prompt/notes
      "*@school.example.org": School

rules:
  default_alert_time: "16:00"
  review_threshold: 0.75
  reminder_list: Household                # every to-do goes to this one list
  create_missing_lists: true
  self_updates: true                      # my replies ("I'll do it tomorrow", "got it") may change items
  person_tags: true                       # tag reminders with the person (#Sarah)
  person_in_title: false                  # "Pick up eggs · Sarah" (name + summary are always in the notes)
  open_item_days: 21                      # how far back "never mind" / "move it to Friday" can reach
  track_promises: true                    # "I'll send it tonight" in my messages → a promise to-do
  waiting_list: "⏳ Waiting on"            # "I'll get back to you Monday" → follow-up (column per person)
  waiting_default_days: 3
  breakdown: true                         # big/vague tasks get "👉 Start: …" + a few steps

daily:                                    # today's few things each morning, a recap each evening
  enabled: true
  morning_time: "07:30"
  evening_time: "20:30"
  count: 3
  today_view: true                        # move picks into Reminders' Today view (restored if not done)
  discord: true
  calendars:
    default: Family
    default_duration_min: 60
    alert_minutes_before: 30

# Things worth keeping that aren't to-dos. Each collection is one Reminders list; with
# group_by_person each person gets a section (a column in Reminders' column view). Omit this
# section to use the defaults (gift ideas, people, places, watch & read, recipes, someday).
# Easier to edit on the dashboard's Settings page.
# collections:
#   - key: gift_ideas
#     label: Gift ideas
#     list: "🎁 Gift ideas"
#     group_by_person: true
#     description: Something a person says they want or would like as a gift — include the link.
#     enabled: true

alerts:
  discord_webhook_url: null               # or HA_DISCORD_WEBHOOK_URL
  heartbeat_timeout_s: 180

dashboard:
  public_url: http://brain:8080           # used in Discord links (Tailscale name)
  password: null                          # optional HTTP basic auth (user "admin")

security:
  agent_token: change-me                  # mac-agent reads its copy from Keychain

storage:
  db_path: /data/brain.db
  backup_dir: /data/backups
  backup_keep: 14
